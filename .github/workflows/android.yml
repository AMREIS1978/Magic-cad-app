name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Validar APK e assinatura Android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MagicCAD-Survey-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Disponibilizar APK em link fixo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/MagicCAD-Survey.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/MagicCAD-Survey.apk
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar APK Android para download direto [skip ci]"
            git push origin HEAD:main
          fi
      - name: Criar release opcional
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "survey-build-${{ github.run_number }}" downloads/MagicCAD-Survey.apk --title "MagicCAD Survey Android #${{ github.run_number }}" --notes "Versão de teste Android." --latest
