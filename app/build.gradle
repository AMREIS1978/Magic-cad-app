plugins { id 'com.android.application' }

android {
    namespace 'pt.magiccad.survey'
    compileSdk 35
    defaultConfig {
        applicationId 'pt.magiccad.survey'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
