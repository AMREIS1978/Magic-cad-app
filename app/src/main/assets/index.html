<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MagicCAD Survey</title><style>body{margin:0;background:#101827;color:#eef5ff;font:16px system-ui}header{background:#1b304a;padding:20px;font-size:23px;font-weight:bold}main{padding:15px;max-width:700px;margin:auto}section{background:#1c2b40;border:1px solid #344960;border-radius:15px;padding:16px;margin:12px 0}button{background:#48d0ae;color:#071b20;border:0;border-radius:10px;padding:13px;font-weight:bold;margin:5px 3px}input,select{background:#101827;color:white;padding:12px;border:1px solid #5b6d81;border-radius:8px;max-width:90%}label{display:block;margin:10px 0 5px}small{color:#bac9db}#points{max-height:230px;overflow:auto}#points div{padding:7px;border-bottom:1px solid #3a4b62}svg{background:#0e1b2b;border-radius:10px;width:100%;height:240px}</style></head><body><header>◈ MagicCAD Survey</header><main><section><label>Nome do levantamento</label><input id="project" value="Levantamento 01"><label>Elemento</label><select id="code"><option>TERRENO</option><option>MURO</option><option>EDIFICIO</option><option>ARVORE</option><option>CAMINHO</option><option>LIMITE</option><option>OUTRO</option></select><label>Observações</label><input id="note" placeholder="Descrição"><label>Cota manual (m, opcional)</label><input id="alt" type="number" step=".001" placeholder="Altitude GPS"><p id="status">GPS ainda não consultado</p><button id="capture">◎ Registar ponto GPS</button><button id="track">▶ Percurso automático</button></section><section><strong id="count">0 pontos</strong><p id="coords"></p><svg id="map" viewBox="0 0 400 240"></svg><small>Esquema de pontos, não cartografia de referência.</small></section><section><h3>Pontos registados</h3><div id="points"></div><button id="undo">Anular último</button><button id="clear">Limpar</button></section><section><h3>Exportar para MagicCAD</h3><button id="dxf">DXF</button><button id="csv">CSV</button><button id="geo">GeoJSON</button><button id="json">MagicCAD JSON</button><p><small>DXF em coordenadas métricas locais aproximadas; dados originais GPS nos restantes formatos. Não substitui levantamento topográfico RTK.</small></p></section></main><script src="app.js"></script></body></html>
